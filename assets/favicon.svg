<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#18271e"/>
      <stop offset="100%" stop-color="#0c120e"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a7e0"/>
      <stop offset="55%" stop-color="#9b6fc4"/>
      <stop offset="100%" stop-color="#6f4a9c"/>
    </linearGradient>
    <linearGradient id="petal2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8c0ea"/>
      <stop offset="100%" stop-color="#8a63b8"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="#c9a227" stroke-width="2"/>
  <!-- stem -->
  <path d="M32 54 C30 44 31 38 32 33" fill="none" stroke="#46785a" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M32 46 C27 44 24 41 22 37" fill="none" stroke="#46785a" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 42 C37 41 40 38 42 34" fill="none" stroke="#46785a" stroke-width="2" stroke-linecap="round"/>
  <!-- side bud left -->
  <g transform="translate(20 33) rotate(-24)">
    <path d="M0 0 C-5 -3 -5 -10 0 -13 C5 -10 5 -3 0 0 Z" fill="url(#petal2)"/>
  </g>
  <!-- side bud right -->
  <g transform="translate(44 31) rotate(22)">
    <path d="M0 0 C-5 -3 -5 -10 0 -13 C5 -10 5 -3 0 0 Z" fill="url(#petal2)"/>
  </g>
  <!-- main trumpet flower (5 lobes) -->
  <g transform="translate(32 24)">
    <ellipse cx="-9" cy="-2" rx="6.5" ry="8" fill="url(#petal)" transform="rotate(-32 -9 -2)"/>
    <ellipse cx="9" cy="-2" rx="6.5" ry="8" fill="url(#petal)" transform="rotate(32 9 -2)"/>
    <ellipse cx="-5" cy="-11" rx="6" ry="7.5" fill="url(#petal2)" transform="rotate(-14 -5 -11)"/>
    <ellipse cx="5" cy="-11" rx="6" ry="7.5" fill="url(#petal2)" transform="rotate(14 5 -11)"/>
    <ellipse cx="0" cy="2" rx="7" ry="8" fill="url(#petal)"/>
    <!-- throat -->
    <circle cx="0" cy="-2" r="4.4" fill="#4a2f78"/>
    <circle cx="0" cy="-2" r="2" fill="#e9cf72"/>
  </g>
</svg>
